<style>

</style></head><body><div class="bg"></div><main class="page"><div class="eyebrow">此刻 · LOGO 方向 02</div><h1 class="heading">再少一点，留出分量。</h1><p class="intro">三个克制的图形方案，放在菜单栏里看整体气质。</p><div class="grid">

<article class="card two"><div class="no">02 / 停顿</div><div class="symbol-stage"><svg viewBox="0 0 40 40" fill="none" aria-label="停顿"><path d="M7.5 20h9m7 0h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="20" cy="20" r="5.2" fill="#f0eee8" stroke="currentColor" stroke-width="1.8"/></svg></div><div class="name">此刻</div><div class="desc">一条线中轻轻停一下。安定、利落，有管家的沉着。</div><div class="bar"><svg viewBox="0 0 40 40" fill="none"><path d="M5 20h10m10 0h10" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><circle cx="20" cy="20" r="5" fill="#f1efea" stroke="currentColor" stroke-width="2.4"/></svg><span class="barname">此刻</span></div></article>
<article class="card three"><div class="no">03 / 印记</div><div class="symbol-stage"><svg viewBox="0 0 40 40" fill="none" aria-label="印记"><path d="M12 9.5h11.5a7 7 0 0 1 0 14H12v-14Z" stroke="currentColor" stroke-width="1.7"/><path d="M12 23.5v7h11.5a7 7 0 0 0 0-14H20" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="27" cy="11" r="2" fill="currentColor"/></svg></div><div class="name">此刻</div><div class="desc">由「此」的笔意抽象而来。更像专属标记，仍保持轻盈。</div><div class="bar"><svg viewBox="0 0 40 40" fill="none"><path d="M12 9.5h11.5a7 7 0 0 1 0 14H12v-14Z" stroke="currentColor" stroke-width="2.4"/><path d="M12 23.5v7h11.5a7 7 0 0 0 0-14H20" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="27" cy="11" r="2.3" fill="currentColor"/></svg><span class="barname">此刻</span></div></article>
